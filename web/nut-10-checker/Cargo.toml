[package]
name = "nut-10-checker"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"
bip39 = "2.1"
qrcode = "0.14"
async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync"] }

# CDK dependencies
cdk = { path = "../../crates/cdk", default-features = false, features = ["wallet"] }
cdk-common = { path = "../../crates/cdk-common", default-features = false }
cashu = { path = "../../crates/cashu", default-features = false }

[dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Storage",
    "console",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
]

[profile.release]
opt-level = "z"
lto = true

[workspace]
# Empty workspace to exclude from parent workspace
