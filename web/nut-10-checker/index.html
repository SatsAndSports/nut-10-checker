<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUT-10 Spending Conditions Checker</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔐 NUT-10 Spending Conditions Checker</h1>
            <p class="subtitle">Interactive testing tool for Cashu spending conditions (P2PK, HTLC, SigAll)</p>
        </header>

        <section class="mints-section">
            <h2>Mints</h2>
            <div id="mints-list"></div>
            <div class="add-mint">
                <input type="text" id="mint-url" placeholder="Mint URL (e.g., http://localhost:3338)">
                <button id="add-mint-btn">Add Mint</button>
            </div>
        </section>

        <section class="wallet-section">
            <h2>Wallet</h2>
            <div id="wallet-info">
                <p>Loading wallet...</p>
            </div>
            <div class="mint-controls">
                <input type="number" id="mint-amount" placeholder="Amount (sat)" value="100" min="1">
                <button id="mint-tokens-btn">Mint Tokens</button>
            </div>
        </section>

        <!-- Mint Invoice Dialog -->
        <div id="mint-dialog" class="dialog" style="display: none;">
            <div class="dialog-content">
                <h3>Pay Lightning Invoice</h3>
                <div id="qr-code"></div>
                <div id="invoice-text"></div>
                <div id="payment-status">Waiting for payment...</div>
                <button id="close-dialog-btn">Close</button>
            </div>
        </div>

        <!-- Check State Results Dialog -->
        <div id="check-state-dialog" class="dialog" style="display: none;">
            <div class="dialog-content">
                <h3>Proof State Check Results</h3>
                <div id="check-state-results"></div>
                <button id="close-check-state-btn">Close</button>
            </div>
        </div>

        <section class="tests-section">
            <h2>Run Tests</h2>
            <div class="test-categories">
                <label>
                    <input type="checkbox" id="test-p2pk">
                    P2PK 2-of-2 Multisig
                </label>
                <label>
                    <input type="checkbox" id="test-p2pk-individual">
                    P2PK 2-of-2 Multisig - individual proofs
                </label>
                <label>
                    <input type="checkbox" id="test-p2pk-sigall">
                    P2PK 2-of-2 Multisig SIGALL
                </label>
            </div>
            <button id="run-tests-btn" class="primary">Run Tests</button>
        </section>

        <section class="results-section">
            <h2>Test Results</h2>
            <div class="results-filter">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="passed">Passed</button>
                <button class="filter-btn" data-filter="failed">Failed</button>
            </div>
            <div id="results-list"></div>
            <div class="results-actions">
                <button id="export-results-btn">Export Results</button>
                <button id="clear-results-btn">Clear History</button>
            </div>
        </section>
    </div>

    <script type="module">
        import init, {
            greet,
            check_nut11_support,
            generate_test_keypairs,
            generate_wallet_seed,
            create_mint_quote,
            check_mint_quote_status,
            mint_tokens,
            get_wallet_balance,
            get_wallet_balance_by_state,
            get_mint_denominations,
            swap_to_p2pk_2of2,
            swap_with_p2pk,
            swap_with_sig_all,
            sign_proofs_with_sig_all,
            submit_signed_proofs,
            check_proofs_state,
            check_specific_proofs_state,
            add_proofs_to_wallet,
            // Low-level helpers
            create_blinded_outputs,
            create_blinded_outputs_with_p2pk,
            create_spending_conditions_p2pk_2of2,
            create_swap_request,
            sign_swap_request_sigall,
            submit_swap_request,
            unblind_signatures
        } from './pkg/nut_10_checker.js';
        import {
            initDB,
            saveMint,
            getMints,
            getMint,
            setActiveMint,
            getActiveMint,
            deleteMint,
            saveTestResult,
            getTestResults,
            clearTestResults,
            exportResults,
            loadAndRenderMints,
            loadAndRenderResults
        } from './app.js';

        let wasm;

        async function run() {
            // Initialize WASM
            wasm = await init();
            console.log(greet('WASM'));

            // Initialize IndexedDB
            await initDB();
            console.log('IndexedDB initialized');

            // Initialize app
            await initApp();
        }

        async function initApp() {
            document.getElementById('wallet-info').innerHTML = '<p>✅ Wallet ready (WASM + IndexedDB loaded)</p>';

            // Event listeners
            document.getElementById('add-mint-btn').addEventListener('click', addMint);
            document.getElementById('mint-url').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    addMint();
                }
            });
            document.getElementById('mint-tokens-btn').addEventListener('click', mintTokens);
            document.getElementById('close-dialog-btn').addEventListener('click', closeDialog);
            document.getElementById('run-tests-btn').addEventListener('click', runTests);
            document.getElementById('export-results-btn').addEventListener('click', handleExportResults);
            document.getElementById('clear-results-btn').addEventListener('click', handleClearResults);

            // Filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    await loadAndRenderResults(e.target.dataset.filter);
                });
            });

            // Listen for balance update requests
            window.addEventListener('updateBalance', async (e) => {
                await updateBalanceDisplay(e.detail.mintUrl);
            });

            // Load persisted data
            await loadAndRenderMints();
            await loadAndRenderResults();

            // Update balances for all mints
            const mints = await getMints();
            for (const mint of mints) {
                await updateBalanceDisplay(mint.url);
            }
        }

        async function addMint() {
            const url = document.getElementById('mint-url').value.trim();
            if (!url) return;

            try {
                // Check if mint supports NUT-11
                const supported = await check_nut11_support(url);

                if (!supported) {
                    alert(`Mint ${url} does not support NUT-11 (P2PK). Cannot add.`);
                    return;
                }

                // Generate wallet seed for this mint
                const seed = generate_wallet_seed();
                console.log('Generated seed for', url);

                await saveMint(url, { nut11Supported: true, seed: seed });
                document.getElementById('mint-url').value = '';
                await loadAndRenderMints();

                // Update balances for ALL mints after re-rendering
                const allMints = await getMints();
                for (const mint of allMints) {
                    await updateBalanceDisplay(mint.url);
                }

                console.log('✅ Added mint:', url);
            } catch (err) {
                console.error('Failed to add mint:', err);
                alert(`Failed to add mint: ${err.message || err}`);
            }
        }

        async function runTests() {
            const testP2PK = document.getElementById('test-p2pk').checked;
            const testP2PKIndividual = document.getElementById('test-p2pk-individual').checked;
            const testP2PKSigAll = document.getElementById('test-p2pk-sigall').checked;

            if (!testP2PK && !testP2PKIndividual && !testP2PKSigAll) {
                alert('Please check at least one test to run');
                return;
            }

            const activeMint = await getActiveMint();
            if (!activeMint) {
                alert('Please add a mint and set it as active first');
                return;
            }

            console.log('Running tests on mint:', activeMint.url);

            // Single timestamp for the entire batch
            const batchTimestamp = Date.now();

            // Run P2PK 2-of-2 test
            if (testP2PK) {
                const testId = `test-${Date.now()}`;
                await runP2PK2of2Test(activeMint, testId, batchTimestamp);
            }

            // Run P2PK 2-of-2 individual proofs test
            if (testP2PKIndividual) {
                const testId = `test-${Date.now()}`;
                await runP2PK2of2IndividualTest(activeMint, testId, batchTimestamp);
            }

            // Run P2PK 2-of-2 SigAll test
            if (testP2PKSigAll) {
                const testId = `test-${Date.now()}`;
                await runP2PK2of2SigAllTest(activeMint, testId, batchTimestamp);
            }

            await loadAndRenderResults();
        }

        async function runP2PK2of2Test(mint, testId, timestamp) {
            const testName = 'P2PK 2-of-2 Multisig';
            console.log(`Starting test: ${testName}`);

            // Step 0: Get mint denominations
            console.log('Step 0: Getting mint denominations...');
            const denominations = await get_mint_denominations(mint.url);
            console.log('Mint denominations:', denominations);

            // Check wallet balance first
            const balance = await get_wallet_balance(mint.url, mint.info.seed);
            console.log('Current wallet balance:', balance, 'sat');

            if (balance < 3) {
                console.error('Insufficient balance for test');
                await saveTestResult({
                    testId, testName, mintUrl: mint.url, timestamp,
                    stepNumber: 1, stepName: 'Swap tokens for P2PK',
                    expected: 'Success', actual: 'Insufficient balance',
                    state: 'Failed',
                    details: `Need at least 3 sat, have ${balance} sat. Please mint tokens first.`
                });
                await loadAndRenderResults();
                // Skip remaining steps
                for (let i = 2; i <= 4; i++) {
                    const stepNames = ['', '', 'Sign with Alice only', 'Sign with Bob only', 'Sign with both Alice and Bob'];
                    await saveTestResult({
                        testId, testName, mintUrl: mint.url, timestamp,
                        stepNumber: i, stepName: stepNames[i],
                        expected: i === 4 ? 'Accept' : 'Reject',
                        actual: 'Skipped', state: 'Skipped'
                    });
                }
                return;
            }

            // Generate test keypairs
            const keypairs = generate_test_keypairs();
            console.log('Generated keypairs:', keypairs);

            // WASM returns a Map, not a plain object
            const aliceSecret = keypairs.get ? keypairs.get('alice_secret') : keypairs.alice_secret;
            const alicePubkey = keypairs.get ? keypairs.get('alice_pubkey') : keypairs.alice_pubkey;
            const bobSecret = keypairs.get ? keypairs.get('bob_secret') : keypairs.bob_secret;
            const bobPubkey = keypairs.get ? keypairs.get('bob_pubkey') : keypairs.bob_pubkey;

            console.log('Extracted keypairs:');
            console.log('  Alice secret:', aliceSecret);
            console.log('  Alice pubkey:', alicePubkey);
            console.log('  Bob secret:', bobSecret);
            console.log('  Bob pubkey:', bobPubkey);

            // Step 1: Swap existing tokens for P2PK 2-of-2 tokens
            let proofs;
            try {
                console.log(`Step 1: Swapping for P2PK 2-of-2 tokens (1, 2 sat)...`);
                console.log('Mint URL:', mint.url);
                console.log('Alice pubkey:', alicePubkey);
                console.log('Bob pubkey:', bobPubkey);

                // Convert denominations to array if it's a Map/other type
                const denominationsArray = Array.isArray(denominations) ? denominations : Array.from(denominations);
                console.log('Denominations array:', denominationsArray);

                // Use the new function to swap tokens for P2PK (no SigAll for basic test)
                proofs = await swap_to_p2pk_2of2(
                    mint.url,
                    mint.info.seed,
                    alicePubkey,
                    bobPubkey,
                    denominationsArray,
                    false  // use_sig_all = false
                );
                console.log('Swapped to P2PK proofs:', proofs);

                await saveTestResult({
                    testId,
                    testName,
                    mintUrl: mint.url,
                    timestamp,
                    stepNumber: 1,
                    stepName: 'Swap tokens for P2PK',
                    expected: 'Success',
                    actual: 'Success',
                    state: 'Passed',
                    details: 'Swapped for 2 P2PK 2-of-2 tokens (1, 2 sat)'
                });
                await loadAndRenderResults();
            } catch (err) {
                console.error('Failed to swap for P2PK tokens:', err);
                await saveTestResult({
                    testId, testName, mintUrl: mint.url, timestamp,
                    stepNumber: 1, stepName: 'Swap tokens for P2PK',
                    expected: 'Success', actual: 'Error', state: 'Failed',
                    details: err.message || String(err)
                });
                await loadAndRenderResults();
                // Skip remaining steps
                for (let i = 2; i <= 4; i++) {
                    const stepNames = ['', '', 'Sign with Alice only', 'Sign with Bob only', 'Sign with both Alice and Bob'];
                    await saveTestResult({
                        testId, testName, mintUrl: mint.url, timestamp,
                        stepNumber: i, stepName: stepNames[i],
                        expected: i === 4 ? 'Accept' : 'Reject',
                        actual: 'Skipped', state: 'Skipped'
                    });
                    await loadAndRenderResults();
                }
                return;
            }

            // Step 2: Try to swap with Alice's signature only (should reject)
            try {
                const result = await swap_with_p2pk(
                    mint.url,
                    proofs,
                    [aliceSecret]
                );

                if (result.success) {
                    await saveTestResult({
                        testId, testName, mintUrl: mint.url, timestamp,
                        stepNumber: 2, stepName: 'Sign with Alice only',
                        expected: 'Reject', actual: 'Accept', state: 'Failed',
                        details: 'Swap succeeded with only 1 signature (expected to fail)'
                    });
                    await loadAndRenderResults();
                    // Skip remaining since proofs are spent
                    await saveTestResult({
                        testId, testName, mintUrl: mint.url, timestamp,
                        stepNumber: 3, stepName: 'Sign with Bob only',
                        expected: 'Reject', actual: 'Skipped', state: 'Skipped'
                    });
                    await loadAndRenderResults();
                    await saveTestResult({
                        testId, testName, mintUrl: mint.url, timestamp,
                        stepNumber: 4, stepName: 'Sign with both Alice and Bob',
                        expected: 'Accept', actual: 'Skipped', state: 'Skipped'
                    });
                    await loadAndRenderResults();
                    return;
                } else {
                    await saveTestResult({
                        testId, testName, mintUrl: mint.url, timestamp,
                        stepNumber: 2, stepName: 'Sign with Alice only',
                        expected: 'Reject', actual: 'Reject', state: 'Passed',
                        details: `Correctly rejected: ${result.error}`
                    });
                    await loadAndRenderResults();
                }
            } catch (err) {
                await saveTestResult({
                    testId, testName, mintUrl: mint.url, timestamp,
                    stepNumber: 2, stepName: 'Sign with Alice only',
                    expected: 'Reject', actual: 'Error', state: 'Failed',
                    details: err.message || String(err)
                });
                await loadAndRenderResults();
                // Skip remaining
                await saveTestResult({
                    testId, testName, mintUrl: mint.url, timestamp,
                    stepNumber: 3, stepName: 'Sign with Bob only',
                    expected: 'Reject', actual: 'Skipped', state: 'Skipped'
                });
                await loadAndRenderResults();
                await saveTestResult({
                    testId, testName, mintUrl: mint.url, timestamp,
                    stepNumber: 4, stepName: 'Sign with both Alice and Bob',
                    expected: 'Accept', actual: 'Skipped', state: 'Skipped'
                });
                await loadAndRenderResults();
                return;
            }

            // Step 3: Try to swap with Bob's signature only (should reject)
            try {
                const result = await swap_with_p2pk(
                    mint.url,
                    proofs,
                    [bobSecret]
                );

                if (result.success) {
                    await saveTestResult({
                        testId, testName, mintUrl: mint.url, timestamp,
                        stepNumber: 3, stepName: 'Sign with Bob only',
                        expected: 'Reject', actual: 'Accept', state: 'Failed',
                        details: 'Swap succeeded with only 1 signature (expected to fail)'
                    });
                    await loadAndRenderResults();
                    // Skip remaining
                    await saveTestResult({
                        testId, testName, mintUrl: mint.url, timestamp,
                        stepNumber: 4, stepName: 'Sign with both Alice and Bob',
                        expected: 'Accept', actual: 'Skipped', state: 'Skipped'
                    });
                    await loadAndRenderResults();
                    return;
                } else {
                    await saveTestResult({
                        testId, testName, mintUrl: mint.url, timestamp,
                        stepNumber: 3, stepName: 'Sign with Bob only',
                        expected: 'Reject', actual: 'Reject', state: 'Passed',
                        details: `Correctly rejected: ${result.error}`
                    });
                    await loadAndRenderResults();
                }
            } catch (err) {
                await saveTestResult({
                    testId, testName, mintUrl: mint.url, timestamp,
                    stepNumber: 3, stepName: 'Sign with Bob only',
                    expected: 'Reject', actual: 'Error', state: 'Failed',
                    details: err.message || String(err)
                });
                await loadAndRenderResults();
                // Skip remaining
                await saveTestResult({
                    testId, testName, mintUrl: mint.url, timestamp,
                    stepNumber: 4, stepName: 'Sign with both Alice and Bob',
                    expected: 'Accept', actual: 'Skipped', state: 'Skipped'
                });
                await loadAndRenderResults();
                return;
            }

            // Step 4: Try to swap with both signatures (should succeed)
            try {
                const result = await swap_with_p2pk(
                    mint.url,
                    proofs,
                    [aliceSecret, bobSecret]
                );

                if (result.success) {
                    // Store output proofs back to wallet to avoid losing sats
                    if (result.proofs && result.proofs.length > 0) {
                        console.log('Step 4: Adding output proofs back to wallet:', result.proofs);
                        try {
                            await add_proofs_to_wallet(mint.url, mint.info.seed, result.proofs);
                            console.log('Successfully added output proofs to wallet');

                            // Update balance display
                            await updateBalanceDisplay(mint.url);
                        } catch (addErr) {
                            console.error('Failed to add proofs to wallet:', addErr);
                            // Still mark test as passed, but note the issue
                        }
                    }

                    await saveTestResult({
                        testId, testName, mintUrl: mint.url, timestamp,
                        stepNumber: 4, stepName: 'Sign with both Alice and Bob',
                        expected: 'Accept', actual: 'Accept', state: 'Passed',
                        details: 'Swap succeeded with both signatures'
                    });
                    await loadAndRenderResults();
                } else {
                    await saveTestResult({
                        testId, testName, mintUrl: mint.url, timestamp,
                        stepNumber: 4, stepName: 'Sign with both Alice and Bob',
                        expected: 'Accept', actual: 'Reject', state: 'Failed',
                        details: `Swap rejected: ${result.error}`
                    });
                    await loadAndRenderResults();
                }
            } catch (err) {
                await saveTestResult({
                    testId, testName, mintUrl: mint.url, timestamp,
                    stepNumber: 4, stepName: 'Sign with both Alice and Bob',
                    expected: 'Accept', actual: 'Error', state: 'Failed',
                    details: err.message || String(err)
                });
                await loadAndRenderResults();
            }
        }

        async function runP2PK2of2IndividualTest(mint, testId, timestamp) {
            const testName = 'P2PK 2-of-2 Multisig - individual proofs';
            console.log(`Starting test: ${testName}`);

            // Step 0: Get mint denominations
            console.log('Step 0: Getting mint denominations...');
            const denominations = await get_mint_denominations(mint.url);
            console.log('Mint denominations:', denominations);

            // Check wallet balance first
            const balance = await get_wallet_balance(mint.url, mint.info.seed);
            console.log('Current wallet balance:', balance, 'sat');

            if (balance < 3) {
                console.error('Insufficient balance for test');
                await saveTestResult({
                    testId, testName, mintUrl: mint.url, timestamp,
                    stepNumber: 1, stepName: 'Swap tokens for P2PK',
                    expected: 'Success', actual: 'Insufficient balance',
                    state: 'Failed',
                    details: `Need at least 3 sat, have ${balance} sat. Please mint tokens first.`
                });
                await loadAndRenderResults();
                // Skip remaining steps
                for (let i = 2; i <= 3; i++) {
                    const stepNames = ['', '', 'Sign and spend 1 sat proof', 'Sign and spend 2 sat proof'];
                    await saveTestResult({
                        testId, testName, mintUrl: mint.url, timestamp,
                        stepNumber: i, stepName: stepNames[i],
                        expected: 'Accept', actual: 'Skipped', state: 'Skipped'
                    });
                    await loadAndRenderResults();
                }
                return;
            }

            // Generate test keypairs
            const keypairs = generate_test_keypairs();
            console.log('Generated keypairs:', keypairs);

            const aliceSecret = keypairs.get ? keypairs.get('alice_secret') : keypairs.alice_secret;
            const alicePubkey = keypairs.get ? keypairs.get('alice_pubkey') : keypairs.alice_pubkey;
            const bobSecret = keypairs.get ? keypairs.get('bob_secret') : keypairs.bob_secret;
            const bobPubkey = keypairs.get ? keypairs.get('bob_pubkey') : keypairs.bob_pubkey;

            console.log('Extracted keypairs:');
            console.log('  Alice secret:', aliceSecret);
            console.log('  Alice pubkey:', alicePubkey);
            console.log('  Bob secret:', bobSecret);
            console.log('  Bob pubkey:', bobPubkey);

            // Step 1: Swap existing tokens for P2PK 2-of-2 tokens
            let proofs;
            try {
                console.log(`Step 1: Swapping for P2PK 2-of-2 tokens (1, 2 sat)...`);
                console.log('Mint URL:', mint.url);
                console.log('Alice pubkey:', alicePubkey);
                console.log('Bob pubkey:', bobPubkey);

                const denominationsArray = Array.isArray(denominations) ? denominations : Array.from(denominations);
                console.log('Denominations array:', denominationsArray);

                proofs = await swap_to_p2pk_2of2(
                    mint.url,
                    mint.info.seed,
                    alicePubkey,
                    bobPubkey,
                    denominationsArray,
                    false  // use_sig_all = false
                );
                console.log('Swapped to P2PK proofs:', proofs);

                await saveTestResult({
                    testId, testName, mintUrl: mint.url, timestamp,
                    stepNumber: 1, stepName: 'Swap tokens for P2PK',
                    expected: 'Success', actual: 'Success', state: 'Passed',
                    details: 'Swapped for 2 P2PK 2-of-2 tokens (1, 2 sat)'
                });
                await loadAndRenderResults();
            } catch (err) {
                console.error('Failed to swap for P2PK tokens:', err);
                await saveTestResult({
                    testId, testName, mintUrl: mint.url, timestamp,
                    stepNumber: 1, stepName: 'Swap tokens for P2PK',
                    expected: 'Success', actual: 'Error', state: 'Failed',
                    details: err.message || String(err)
                });
                await loadAndRenderResults();
                // Skip remaining steps
                for (let i = 2; i <= 3; i++) {
                    const stepNames = ['', '', 'Sign and spend 1 sat proof', 'Sign and spend 2 sat proof'];
                    await saveTestResult({
                        testId, testName, mintUrl: mint.url, timestamp,
                        stepNumber: i, stepName: stepNames[i],
                        expected: 'Accept', actual: 'Skipped', state: 'Skipped'
                    });
                    await loadAndRenderResults();
                }
                return;
            }

            // Convert proofs to array if needed
            const proofsArray = Array.isArray(proofs) ? proofs : Array.from(proofs);
            if (proofsArray.length !== 2) {
                console.error('Expected 2 proofs but got', proofsArray.length);
                for (let i = 2; i <= 3; i++) {
                    const stepNames = ['', '', 'Sign and spend 1 sat proof', 'Sign and spend 2 sat proof'];
                    await saveTestResult({
                        testId, testName, mintUrl: mint.url, timestamp,
                        stepNumber: i, stepName: stepNames[i],
                        expected: 'Accept', actual: 'Error', state: 'Failed',
                        details: `Expected 2 proofs but got ${proofsArray.length}`
                    });
                    await loadAndRenderResults();
                }
                return;
            }

            // Step 2: Spend first proof (1 sat) with both signatures
            try {
                const result = await swap_with_p2pk(
                    mint.url,
                    [proofsArray[0]],
                    [aliceSecret, bobSecret]
                );

                if (result.success) {
                    // Store output proofs back to wallet
                    if (result.proofs && result.proofs.length > 0) {
                        console.log('Step 2: Adding output proofs back to wallet:', result.proofs);
                        try {
                            await add_proofs_to_wallet(mint.url, mint.info.seed, result.proofs);
                            console.log('Successfully added output proofs to wallet');
                            await updateBalanceDisplay(mint.url);
                        } catch (addErr) {
                            console.error('Failed to add proofs to wallet:', addErr);
                        }
                    }

                    await saveTestResult({
                        testId, testName, mintUrl: mint.url, timestamp,
                        stepNumber: 2, stepName: 'Sign and spend 1 sat proof',
                        expected: 'Accept', actual: 'Accept', state: 'Passed',
                        details: 'Successfully spent 1 sat proof with both signatures'
                    });
                    await loadAndRenderResults();
                } else {
                    await saveTestResult({
                        testId, testName, mintUrl: mint.url, timestamp,
                        stepNumber: 2, stepName: 'Sign and spend 1 sat proof',
                        expected: 'Accept', actual: 'Reject', state: 'Failed',
                        details: `Swap rejected: ${result.error}`
                    });
                    await loadAndRenderResults();
                    // Skip remaining step
                    await saveTestResult({
                        testId, testName, mintUrl: mint.url, timestamp,
                        stepNumber: 3, stepName: 'Sign and spend 2 sat proof',
                        expected: 'Accept', actual: 'Skipped', state: 'Skipped'
                    });
                    await loadAndRenderResults();
                    return;
                }
            } catch (err) {
                await saveTestResult({
                    testId, testName, mintUrl: mint.url, timestamp,
                    stepNumber: 2, stepName: 'Sign and spend 1 sat proof',
                    expected: 'Accept', actual: 'Error', state: 'Failed',
                    details: err.message || String(err)
                });
                await loadAndRenderResults();
                // Skip remaining step
                await saveTestResult({
                    testId, testName, mintUrl: mint.url, timestamp,
                    stepNumber: 3, stepName: 'Sign and spend 2 sat proof',
                    expected: 'Accept', actual: 'Skipped', state: 'Skipped'
                });
                await loadAndRenderResults();
                return;
            }

            // Step 3: Spend second proof (2 sat) with both signatures
            try {
                const result = await swap_with_p2pk(
                    mint.url,
                    [proofsArray[1]],
                    [aliceSecret, bobSecret]
                );

                if (result.success) {
                    // Store output proofs back to wallet
                    if (result.proofs && result.proofs.length > 0) {
                        console.log('Step 3: Adding output proofs back to wallet:', result.proofs);
                        try {
                            await add_proofs_to_wallet(mint.url, mint.info.seed, result.proofs);
                            console.log('Successfully added output proofs to wallet');
                            await updateBalanceDisplay(mint.url);
                        } catch (addErr) {
                            console.error('Failed to add proofs to wallet:', addErr);
                        }
                    }

                    await saveTestResult({
                        testId, testName, mintUrl: mint.url, timestamp,
                        stepNumber: 3, stepName: 'Sign and spend 2 sat proof',
                        expected: 'Accept', actual: 'Accept', state: 'Passed',
                        details: 'Successfully spent 2 sat proof with both signatures'
                    });
                    await loadAndRenderResults();
                } else {
                    await saveTestResult({
                        testId, testName, mintUrl: mint.url, timestamp,
                        stepNumber: 3, stepName: 'Sign and spend 2 sat proof',
                        expected: 'Accept', actual: 'Reject', state: 'Failed',
                        details: `Swap rejected: ${result.error}`
                    });
                    await loadAndRenderResults();
                }
            } catch (err) {
                await saveTestResult({
                    testId, testName, mintUrl: mint.url, timestamp,
                    stepNumber: 3, stepName: 'Sign and spend 2 sat proof',
                    expected: 'Accept', actual: 'Error', state: 'Failed',
                    details: err.message || String(err)
                });
                await loadAndRenderResults();
            }
        }

        async function runP2PK2of2SigAllTest(mint, testId, timestamp) {
            const testName = 'P2PK 2-of-2 Multisig SIGALL';
            console.log(`Starting test: ${testName}`);

            // Step 0: Get mint denominations
            console.log('Step 0: Getting mint denominations...');
            const denominations = await get_mint_denominations(mint.url);
            console.log('Mint denominations:', denominations);

            // Check wallet balance first
            const balance = await get_wallet_balance(mint.url, mint.info.seed);
            console.log('Current wallet balance:', balance, 'sat');

            if (balance < 3) {
                console.error('Insufficient balance for test');
                await saveTestResult({
                    testId, testName, mintUrl: mint.url, timestamp,
                    stepNumber: 1, stepName: 'Swap tokens for P2PK',
                    expected: 'Success', actual: 'Insufficient balance',
                    state: 'Failed',
                    details: `Need at least 3 sat, have ${balance} sat. Please mint tokens first.`
                });
                await loadAndRenderResults();
                // Skip remaining steps
                await saveTestResult({
                    testId, testName, mintUrl: mint.url, timestamp,
                    stepNumber: 2, stepName: 'Spend first proof individually',
                    expected: 'Reject', actual: 'Skipped', state: 'Skipped'
                });
                await loadAndRenderResults();
                await saveTestResult({
                    testId, testName, mintUrl: mint.url, timestamp,
                    stepNumber: 3, stepName: 'Spend second proof individually',
                    expected: 'Reject', actual: 'Skipped', state: 'Skipped'
                });
                await loadAndRenderResults();
                await saveTestResult({
                    testId, testName, mintUrl: mint.url, timestamp,
                    stepNumber: 4, stepName: 'Spend both proofs together',
                    expected: 'Accept', actual: 'Skipped', state: 'Skipped'
                });
                await loadAndRenderResults();
                return;
            }

            // Generate test keypairs
            const keypairs = generate_test_keypairs();
            const aliceSecret = keypairs.get ? keypairs.get('alice_secret') : keypairs.alice_secret;
            const alicePubkey = keypairs.get ? keypairs.get('alice_pubkey') : keypairs.alice_pubkey;
            const bobSecret = keypairs.get ? keypairs.get('bob_secret') : keypairs.bob_secret;
            const bobPubkey = keypairs.get ? keypairs.get('bob_pubkey') : keypairs.bob_pubkey;

            // Step 1: Create P2PK 2-of-2 tokens with SigAll (using existing helper)
            let p2pkProofs;
            try {
                console.log(`Step 1: Creating P2PK 2-of-2 tokens with SigAll (1, 2 sat)...`);

                const denominationsArray = Array.isArray(denominations) ? denominations : Array.from(denominations);

                p2pkProofs = await swap_to_p2pk_2of2(
                    mint.url,
                    mint.info.seed,
                    alicePubkey,
                    bobPubkey,
                    denominationsArray,
                    true  // use_sig_all = true
                );
                console.log('Created P2PK proofs:', p2pkProofs);

                // Check state of the created proofs
                const states = await check_specific_proofs_state(mint.url, p2pkProofs);
                console.log('Proof states:', states);

                await saveTestResult({
                    testId, testName, mintUrl: mint.url, timestamp,
                    stepNumber: 1, stepName: 'Create P2PK 2-of-2 proofs',
                    expected: 'Success', actual: 'Success', state: 'Passed',
                    details: `Created 2 P2PK 2-of-2 tokens with SigAll (1, 2 sat). States: ${states.join(', ')}`
                });
                await loadAndRenderResults();
            } catch (err) {
                console.error('Failed to create P2PK tokens:', err);
                await saveTestResult({
                    testId, testName, mintUrl: mint.url, timestamp,
                    stepNumber: 1, stepName: 'Create P2PK 2-of-2 proofs',
                    expected: 'Success', actual: 'Error', state: 'Failed',
                    details: err.message || String(err)
                });
                await loadAndRenderResults();
                // Skip remaining steps
                await saveTestResult({
                    testId, testName, mintUrl: mint.url, timestamp,
                    stepNumber: 2, stepName: 'Spend P2PK proofs with 2-of-2 signatures',
                    expected: 'Accept', actual: 'Skipped', state: 'Skipped'
                });
                await loadAndRenderResults();
                return;
            }

            // Step 2: Spend the P2PK proofs (tests 2-of-2 multisig with SigAll)
            try {
                console.log('Step 2: Spending P2PK proofs with 2-of-2 multisig...');

                // 2a. Create regular blinded outputs (no spending conditions)
                console.log('  2a. Creating regular blinded outputs (no conditions)...');
                const regularOutputData = await create_blinded_outputs(mint.url, [BigInt(1), BigInt(2)]);
                const regularOutputs = regularOutputData.outputs;
                const regularSecrets = regularOutputData.secrets;
                const regularFactors = regularOutputData.blinding_factors;
                console.log('  Created 2 regular blinded outputs');

                // 2b. Create swap request (P2PK inputs → regular outputs)
                console.log('  2b. Creating swap request (P2PK inputs → regular outputs)...');
                const swapRequest2 = await create_swap_request(p2pkProofs, regularOutputs);
                console.log('  Created swap request');

                // 2c. Sign swap request with Alice and Bob (2-of-2 multisig with SigAll)
                console.log('  2c. Signing with Alice and Bob (SigAll)...');
                const signedSwapRequest2 = await sign_swap_request_sigall(swapRequest2, [aliceSecret, bobSecret]);
                console.log('  Signed! First proof has 2 signatures, second proof has no witness');

                // 2d. Submit signed swap request
                console.log('  2d. Submitting signed swap request...');
                const result2 = await submit_swap_request(mint.url, signedSwapRequest2);

                if (!result2.success) {
                    throw new Error(`Swap failed: ${result2.error}`);
                }
                console.log('  Swap successful!');

                // 2e. Unblind signatures to get regular proofs
                console.log('  2e. Unblinding signatures...');
                const regularProofs = await unblind_signatures(
                    mint.url,
                    result2.signatures,
                    regularSecrets,
                    regularFactors
                );
                console.log('  Got 2 regular proofs (no spending conditions)');

                // 2f. Add regular proofs back to wallet
                console.log('  2f. Adding regular proofs back to wallet...');
                try {
                    await add_proofs_to_wallet(mint.url, mint.info.seed, regularProofs);
                    console.log('  Successfully added output proofs to wallet');
                    await updateBalanceDisplay(mint.url);
                } catch (addErr) {
                    console.error('  Failed to add proofs to wallet:', addErr);
                }

                await saveTestResult({
                    testId, testName, mintUrl: mint.url, timestamp,
                    stepNumber: 2, stepName: 'Spend P2PK proofs with 2-of-2 signatures',
                    expected: 'Accept', actual: 'Accept', state: 'Passed',
                    details: 'Successfully spent P2PK proofs using 2-of-2 multisig with SigAll'
                });
                await loadAndRenderResults();
            } catch (err) {
                console.error('  Step 2 error:', err);
                await saveTestResult({
                    testId, testName, mintUrl: mint.url, timestamp,
                    stepNumber: 2, stepName: 'Spend P2PK proofs with 2-of-2 signatures',
                    expected: 'Accept', actual: 'Error', state: 'Failed',
                    details: err.message || String(err)
                });
                await loadAndRenderResults();
            }
        }

        async function waitForPayment(mintUrl, seed, quoteId, timeoutSeconds = 300) {
            const maxAttempts = timeoutSeconds / 5;

            for (let i = 0; i < maxAttempts; i++) {
                try {
                    const paid = await check_mint_quote_status(mintUrl, seed, quoteId);
                    if (paid) {
                        return true;
                    }
                } catch (err) {
                    console.error('Error checking payment status:', err);
                }

                await new Promise(resolve => setTimeout(resolve, 5000));
            }

            return false;
        }

        async function handleExportResults() {
            const results = await getTestResults();
            if (results.length === 0) {
                alert('No results to export');
                return;
            }
            exportResults(results);
        }

        async function handleClearResults() {
            if (confirm('Clear all test results? This cannot be undone.')) {
                await clearTestResults();
                await loadAndRenderResults();
            }
        }

        async function mintTokens() {
            const mint = await getActiveMint();
            if (!mint) {
                alert('Please add a mint and set it as active first');
                return;
            }

            if (!mint.isActive) {
                alert('Please select an active mint first by clicking "Set Active"');
                return;
            }

            const amount = parseInt(document.getElementById('mint-amount').value);
            if (!amount || amount < 1) {
                alert('Please enter a valid amount');
                return;
            }

            try {
                // Create mint quote (amount needs to be BigInt)
                const quote = await create_mint_quote(mint.url, mint.info.seed, BigInt(amount));
                console.log('Mint quote created:', quote);

                // Show invoice dialog
                showInvoiceDialog(mint.url, quote.quote_id, quote.request);

                // Start polling for payment
                pollPaymentStatus(mint.url, quote.quote_id);
            } catch (err) {
                console.error('Failed to create mint quote:', err);
                alert(`Failed to create mint quote: ${err.message || err}`);
            }
        }

        function showInvoiceDialog(mintUrl, quoteId, invoice) {
            const dialog = document.getElementById('mint-dialog');
            const qrContainer = document.getElementById('qr-code');
            const invoiceText = document.getElementById('invoice-text');
            const statusText = document.getElementById('payment-status');

            // Clear previous QR code
            qrContainer.innerHTML = '';

            // Generate QR code
            new QRCode(qrContainer, {
                text: invoice,
                width: 256,
                height: 256,
            });

            // Show invoice text
            invoiceText.textContent = invoice;
            invoiceText.style.cursor = 'pointer';
            invoiceText.title = 'Click to copy';
            invoiceText.onclick = () => {
                navigator.clipboard.writeText(invoice);
                alert('Invoice copied to clipboard!');
            };

            // Reset status
            statusText.textContent = 'Waiting for payment...';
            statusText.className = '';

            // Show dialog
            dialog.style.display = 'flex';
        }

        async function handlePaymentSuccess(mintUrl, quoteId, statusText) {
            try {
                // Get mint with seed
                console.log('Looking for mint with URL:', mintUrl);
                const allMints = await getMints();
                console.log('All mints in DB:', allMints);

                const mint = await getMint(mintUrl);
                console.log('Mint object:', mint);
                if (!mint) {
                    console.error('Mint not found:', mintUrl);
                    statusText.textContent = '❌ Error: mint not found';
                    return;
                }
                if (!mint.info) {
                    console.error('Mint.info is null/undefined:', mint);
                    statusText.textContent = '❌ Error: mint.info missing';
                    return;
                }
                if (!mint.info.seed) {
                    console.error('No seed found for mint. mint.info:', mint.info);
                    statusText.textContent = '❌ Error: wallet not initialized';
                    return;
                }

                // Mint the tokens
                statusText.textContent = '⏳ Minting tokens...';
                const minted = await mint_tokens(mintUrl, mint.info.seed, quoteId);
                console.log('✅ Minted', minted, 'sat');

                // Update balance display
                await updateBalanceDisplay(mintUrl);

                statusText.textContent = `✅ Minted ${minted} sat!`;
                statusText.className = 'paid';

                setTimeout(() => {
                    closeDialog();
                }, 2000);
            } catch (err) {
                console.error('Failed to mint tokens:', err);
                statusText.textContent = `❌ Minting failed: ${err.message || err}`;
            }
        }

        async function updateBalanceDisplay(mintUrl) {
            try {
                const mint = await getMint(mintUrl);
                if (!mint || !mint.info.seed) {
                    console.log('No seed for mint:', mintUrl);
                    return;
                }

                console.log('Fetching balance for', mintUrl);
                const balanceByState = await get_wallet_balance_by_state(mintUrl, mint.info.seed);
                console.log('Balance breakdown for', mintUrl, ':', balanceByState);

                // Extract values from Map (WASM returns Map, not plain object)
                const unspent = balanceByState.get ? balanceByState.get('unspent') : balanceByState.unspent;
                const pending = balanceByState.get ? balanceByState.get('pending') : balanceByState.pending;
                const reserved = balanceByState.get ? balanceByState.get('reserved') : balanceByState.reserved;
                const spent = balanceByState.get ? balanceByState.get('spent') : balanceByState.spent;
                const pending_spent = balanceByState.get ? balanceByState.get('pending_spent') : balanceByState.pending_spent;

                // Build balance display string
                let balanceText = `${unspent} sat`;
                const extras = [];
                if (pending > 0) extras.push(`${pending} pending`);
                if (reserved > 0) extras.push(`${reserved} reserved`);
                if (spent > 0) extras.push(`${spent} spent`);
                if (pending_spent > 0) extras.push(`${pending_spent} pending_spent`);

                if (extras.length > 0) {
                    balanceText += ` (${extras.join(', ')})`;
                }

                // Update the UI
                const mintElement = document.querySelector(`.mint-item[data-url="${CSS.escape(mintUrl)}"]`);
                if (mintElement) {
                    const balanceElement = mintElement.querySelector('.mint-balance');
                    if (balanceElement) {
                        balanceElement.textContent = `Balance: ${balanceText}`;
                    }
                } else {
                    console.error('Could not find mint element for:', mintUrl);
                }
            } catch (err) {
                console.error('Failed to get balance for', mintUrl, ':', err);

                // Still update UI to show error
                const mintElement = document.querySelector(`.mint-item[data-url="${CSS.escape(mintUrl)}"]`);
                if (mintElement) {
                    const balanceElement = mintElement.querySelector('.mint-balance');
                    if (balanceElement) {
                        balanceElement.textContent = `Balance: Error`;
                    }
                }
            }
        }

        async function pollPaymentStatus(mintUrl, quoteId) {
            const statusText = document.getElementById('payment-status');
            const maxAttempts = 60; // 5 minutes (60 * 5 seconds)
            let attempts = 0;

            // Get the seed for this mint
            const mint = await getMint(mintUrl);
            if (!mint || !mint.info.seed) {
                statusText.textContent = '❌ Error: wallet not initialized';
                return;
            }

            const interval = setInterval(async () => {
                attempts++;

                try {
                    const paid = await check_mint_quote_status(mintUrl, mint.info.seed, quoteId);

                    if (paid) {
                        clearInterval(interval);
                        await handlePaymentSuccess(mintUrl, quoteId, statusText);
                    } else if (attempts >= maxAttempts) {
                        clearInterval(interval);
                        statusText.textContent = '⏱️ Payment timeout. Please try again.';
                    }
                } catch (err) {
                    console.error('Error checking payment status:', err);
                    // Continue polling - might be a temporary network issue
                }
            }, 5000); // Check every 5 seconds
        }

        function closeDialog() {
            document.getElementById('mint-dialog').style.display = 'none';
        }

        function closeCheckStateDialog() {
            document.getElementById('check-state-dialog').style.display = 'none';
        }

        async function handleCheckState(mintUrl) {
            try {
                const mint = await getMint(mintUrl);
                if (!mint || !mint.info.seed) {
                    alert('No wallet found for this mint');
                    return;
                }

                console.log('Checking proof states for', mintUrl);

                // Call WASM function to check states
                const result = await check_proofs_state(mintUrl, mint.info.seed);
                console.log('Check state result:', result);

                // Extract values (WASM returns Map)
                const checked = result.get ? result.get('checked') : result.checked;
                const changes = result.get ? result.get('changes') : result.changes;

                // Display results in modal
                const resultsDiv = document.getElementById('check-state-results');

                if (checked === 0) {
                    resultsDiv.innerHTML = '<p>No proofs found in wallet.</p>';
                } else if (Object.keys(changes).length === 0) {
                    resultsDiv.innerHTML = `<p>Refreshed ${checked} proof(s).</p>`;
                } else {
                    // Build summary of changes
                    let html = `<p>Refreshed ${checked} proof(s). Found state changes:</p><ul>`;
                    for (const [transition, amount] of Object.entries(changes)) {
                        html += `<li><strong>${transition}:</strong> ${amount} sat</li>`;
                    }
                    html += '</ul>';
                    resultsDiv.innerHTML = html;
                }

                // Show modal
                document.getElementById('check-state-dialog').style.display = 'flex';

                // Update balance display after checking
                await updateBalanceDisplay(mintUrl);
            } catch (err) {
                console.error('Failed to check proof states:', err);
                alert(`Failed to check proof states: ${err.message || err}`);
            }
        }

        // Event listeners
        window.addEventListener('checkState', (e) => {
            handleCheckState(e.detail.mintUrl);
        });

        document.getElementById('close-check-state-btn').addEventListener('click', closeCheckStateDialog);

        run().catch(console.error);
    </script>
